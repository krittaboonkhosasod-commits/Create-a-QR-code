<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>สร้าง QR code</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500&family=Prompt:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
:root{--bg:#eceff5;--panel:#fff;--ink:#0e1424;--muted:#66708a;--line:#e0e4ed;--accent:#2b4cff;--on:#fff;--tint:#e8ecff;--field:#f5f7fb;--shadow:0 1px 2px rgba(14,20,36,.05),0 24px 60px -24px rgba(14,20,36,.22)}
@media(prefers-color-scheme:dark){:root{--bg:#090c15;--panel:#121827;--ink:#eef1fa;--muted:#8a93ac;--line:#232b41;--accent:#7b90ff;--on:#0a0e1a;--tint:#1b2442;--field:#0e1321;--shadow:0 24px 60px -24px rgba(0,0,0,.7)}}
*{box-sizing:border-box}
html{scroll-padding-top:20px}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.6 "IBM Plex Sans Thai",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:1120px;margin:0 auto;padding:36px 20px 28px;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:36px;align-items:start}
.brand{display:flex;align-items:center;gap:11px;margin-bottom:34px}
.mark{width:36px;height:36px;border-radius:10px;background:var(--ink);display:grid;grid-template:repeat(3,1fr)/repeat(3,1fr);gap:3px;padding:8px}
.mark span{background:var(--panel);border-radius:1.5px}.mark span:nth-child(2),.mark span:nth-child(4),.mark span:nth-child(9){opacity:0}
.brand b{font:600 17px Prompt}
h1{font:600 clamp(32px,4.6vw,52px)/1.1 Prompt;letter-spacing:-.03em;margin:0 0 12px}
.lead{margin:0 0 30px;color:var(--muted);max-width:42ch}
.panel{background:var(--panel);border-radius:24px;box-shadow:var(--shadow)}
.sec{padding:24px 26px;border-top:1px solid var(--line)}.sec:first-child{border-top:0}
h2{font:600 15px Prompt;margin:0 0 14px}
.lbl{display:block;font-size:13px;color:var(--muted);margin:18px 0 8px}
.seg{display:flex;flex-wrap:wrap;gap:4px;padding:4px;background:var(--field);border-radius:14px;width:fit-content;max-width:100%}
.seg button{font:inherit;font-size:14px;padding:8px 16px;border:0;border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;transition:background .15s,color .15s}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed=true]{background:var(--panel);color:var(--ink);font-weight:500;box-shadow:0 1px 3px rgba(14,20,36,.14)}
input[type=text]{width:100%;padding:14px 16px;font:inherit;border:1.5px solid transparent;border-radius:14px;background:var(--field);color:var(--ink);outline:none;transition:border-color .15s,background .15s}
input[type=text]::placeholder{color:var(--muted);opacity:.7}
input[type=text]:focus{background:var(--panel);border-color:var(--accent)}
#main{margin-top:16px}.lbl#mainLbl{margin-top:20px}.lbl#mainLbl+#main{margin-top:0}
#wifi{display:grid;gap:10px;margin-top:16px}
#ftext{margin-top:10px}
.sw{display:flex;gap:12px;align-items:center}
.sw button,.sw input{width:34px;height:34px;border-radius:50%;border:0;padding:0;cursor:pointer;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw button[aria-pressed=true]{box-shadow:0 0 0 3px var(--panel),0 0 0 5px var(--ink)}
.sw input{background:none;overflow:hidden}
.row{display:flex;gap:8px;flex-wrap:wrap}
.filebtn{position:relative;display:inline-block;font:inherit;font-size:14px;padding:9px 16px;border:1.5px dashed var(--line);border-radius:12px;background:transparent;color:var(--ink);cursor:pointer;transition:border-color .15s}
.filebtn:hover,.filebtn:focus-within{border-color:var(--accent)}
.filebtn input{position:absolute;opacity:0;width:1px;height:1px}
.go{width:100%;margin-top:24px;padding:16px;border:0;border-radius:16px;background:var(--accent);color:var(--on);font:600 16px Prompt;cursor:pointer;transition:transform .15s,opacity .15s}
.go:hover:not(:disabled){transform:translateY(-1px)}.go:active:not(:disabled){transform:none}
.go:disabled{opacity:.3;cursor:not-allowed}
#msg{min-height:22px;margin:10px 0 0;color:var(--muted);font-size:13px;text-align:center}
.side{position:sticky;top:22px}
.preview{padding:16px}
.preview-title{font:600 15px Prompt;padding:6px 8px 14px;display:flex;justify-content:space-between;align-items:center}
.preview-title small{font:400 12px "IBM Plex Sans Thai";color:var(--muted)}
.stage{position:relative;min-height:400px;border-radius:18px;background:var(--field);background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:16px 16px;padding:11%;display:grid;place-items:center;overflow:hidden}
.stage i{position:absolute;width:26px;height:26px;border:3px solid var(--accent)}
.stage i:nth-of-type(1){top:16px;left:16px;border-right:0;border-bottom:0;border-radius:9px 0 0 0}
.stage i:nth-of-type(2){top:16px;right:16px;border-left:0;border-bottom:0;border-radius:0 9px 0 0}
.stage i:nth-of-type(3){bottom:16px;left:16px;border-right:0;border-top:0;border-radius:0 0 0 9px}
.stage i:nth-of-type(4){bottom:16px;right:16px;border-left:0;border-top:0;border-radius:0 0 9px 0}
canvas{width:100%;height:auto;display:none;border-radius:10px;box-shadow:0 18px 40px -14px rgba(14,20,36,.35)}
.empty{text-align:center;color:var(--muted);max-width:230px}
.empty b{display:block;font:600 18px Prompt;color:var(--ink);margin-bottom:4px}
.empty::before{content:"";display:block;height:2px;width:90px;margin:0 auto 20px;background:var(--accent);border-radius:2px;animation:scan 1.8s ease-in-out infinite alternate}
@keyframes scan{from{transform:translateY(-14px)}to{transform:translateY(14px)}}
@media(prefers-reduced-motion:reduce){.empty::before{animation:none}*{transition:none!important}}
.stage.ready canvas{display:block}.stage.ready .empty{display:none}
.app{position:relative}
body::after{content:"THE END DX TCD";position:fixed;right:max(18px,env(safe-area-inset-right));bottom:max(14px,env(safe-area-inset-bottom));z-index:9;pointer-events:none;font:600 13px Prompt,sans-serif;letter-spacing:.12em;color:var(--ink);opacity:.32}
[hidden]{display:none!important}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media(max-width:860px){.app{grid-template-columns:1fr;gap:22px;padding:22px 14px 20px}.side{position:static;order:-1}.preview{max-width:460px;margin:0 auto}.stage{min-height:300px}.brand{margin-bottom:22px}.lead{margin-bottom:0}.sec{padding:20px}}
</style>
</head>
<body>
<main class="app">
<div>
  <div class="brand"><div class="mark" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></div><b>QR Maker</b></div>
  <h1>สร้าง QR Code<br>ในไม่กี่วินาที</h1>
  <p class="lead">ใส่ข้อมูล เลือกสไตล์ แล้วดาวน์โหลดได้ทันที ภาพคมทุกขนาด</p>

  <div class="panel">
    <section class="sec">
      <h2>เนื้อหา</h2>
      <div class="seg" id="types" role="group" aria-label="ประเภทเนื้อหา"></div>
      <label class="lbl" for="main" id="mainLbl">ลิงก์ของคุณ</label>
      <input id="main" type="text" autocomplete="off">
      <div id="wifi" hidden>
        <input id="ssid" type="text" autocomplete="off" placeholder="ชื่อ Wi-Fi" aria-label="ชื่อ Wi-Fi">
        <input id="pass" type="text" autocomplete="off" placeholder="รหัสผ่าน (เว้นว่างได้)" aria-label="รหัสผ่าน">
      </div>
    </section>

    <section class="sec">
      <h2>ดีไซน์</h2>
      <span class="lbl" id="l-col" style="margin-top:0">สี</span>
      <div class="sw" id="cols" role="group" aria-labelledby="l-col"><input type="color" id="cc" value="#16213a" aria-label="เลือกสีเอง"></div>
      <span class="lbl" id="l-st">รูปแบบจุด</span>
      <div class="seg" id="styles" role="group" aria-labelledby="l-st"></div>
      <span class="lbl" id="l-fr">กรอบ</span>
      <div class="seg" id="frames" role="group" aria-labelledby="l-fr"></div>
      <input id="ftext" type="text" maxlength="20" value="สแกนเลย" aria-label="ข้อความบนกรอบ" hidden>
      <span class="lbl">โลโก้กลาง QR</span>
      <div class="row">
        <label class="filebtn"><input type="file" id="logo" accept="image/*">เพิ่มโลโก้</label>
        <button type="button" class="filebtn" id="rmlogo" hidden>ลบโลโก้</button>
      </div>
    </section>

    <section class="sec">
      <h2>ดาวน์โหลด</h2>
      <span class="lbl" id="l-size" style="margin-top:0">ขนาด (พิกเซล)</span>
      <div class="seg" id="sizes" role="group" aria-labelledby="l-size"></div>
      <span class="lbl" id="l-fmt">ชนิดไฟล์</span>
      <div class="seg" id="fmts" role="group" aria-labelledby="l-fmt"></div>
      <button class="go" id="dl" disabled>ดาวน์โหลด PNG</button>
      <p id="msg" role="status"></p>
    </section>
  </div>
</div>

<aside class="side">
  <div class="panel preview">
    <div class="preview-title">ตัวอย่าง<small>อัปเดตทันทีที่แก้ไข</small></div>
    <div class="stage" id="stage">
      <i></i><i></i><i></i><i></i>
      <canvas id="cv" width="640" height="640" aria-label="ตัวอย่าง QR code"></canvas>
      <div class="empty"><b>รอเนื้อหาอยู่</b>พิมพ์หรือวางข้อมูล แล้ว QR จะขึ้นตรงนี้ทันที</div>
    </div>
  </div>
</aside>
</main>

<script>
const $=id=>document.getElementById(id);
const S={type:'url',fg:'#16213a',style:'square',frame:false,size:1000,fmt:'png',logo:null,logoURL:null};
let model=null;
const PH={url:['ลิงก์ของคุณ','https://example.com'],text:['ข้อความของคุณ','พิมพ์ข้อความที่ต้องการ']};
const holder=document.createElement('div');

function chips(box,key,items){
  items.forEach(([v,l])=>{
    const b=document.createElement('button');b.type='button';b.textContent=l;b.dataset.v=v;
    b.onclick=()=>{S[key]=v;if(key==='type')build();sync()};
    $(box).appendChild(b);
  });
}
chips('types','type',[['url','ลิงก์'],['text','ข้อความ'],['wifi','Wi-Fi']]);
chips('styles','style',[['square','เหลี่ยม'],['round','มน'],['dot','จุดกลม']]);
chips('frames','frame',[[false,'ไม่มี'],[true,'มีกรอบ']]);
chips('sizes','size',[200,500,1000,1500,2000,4096].map(v=>[v,v===4096?'4096 (4K)':v]));
chips('fmts','fmt',[['png','PNG'],['jpg','JPG'],['svg','SVG']]);
['#16213a','#2540ff','#0b7a53','#b3261e','#6b2fb3'].forEach(c=>{
  const b=document.createElement('button');b.type='button';b.style.background=c;b.dataset.v=c;b.setAttribute('aria-label','สี '+c);
  b.onclick=()=>{S.fg=c;$('cc').value=c;sync()};$('cols').insertBefore(b,$('cc'));
});
$('cc').oninput=e=>{S.fg=e.target.value;sync()};

function sync(){
  const on=(box,key)=>document.querySelectorAll('#'+box+' button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v==String(S[key])));
  on('types','type');on('styles','style');on('frames','frame');on('sizes','size');on('fmts','fmt');
  document.querySelectorAll('#cols button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===S.fg));
  const w=S.type==='wifi';
  $('wifi').hidden=!w;$('main').hidden=w;$('mainLbl').hidden=w;
  if(!w){$('mainLbl').textContent=PH[S.type][0];$('main').placeholder=PH[S.type][1]}
  $('ftext').hidden=!S.frame;$('rmlogo').hidden=!S.logo;
  $('dl').textContent='ดาวน์โหลด '+S.fmt.toUpperCase();
  render();
}

const esc=s=>s.replace(/([\\;,:"])/g,'\\$1');
function getText(){
  if(S.type==='wifi'){const s=$('ssid').value.trim(),p=$('pass').value;return s?`WIFI:T:${p?'WPA':'nopass'};S:${esc(s)};${p?'P:'+esc(p)+';':''};`:''}
  return $('main').value.trim();
}
let timer;
['main','ssid','pass'].forEach(i=>$(i).addEventListener('input',()=>{clearTimeout(timer);timer=setTimeout(build,150)}));
$('ftext').addEventListener('input',render);
function build(){
  const v=getText();$('msg').textContent='';
  if(!v){model=null;return render()}
  try{holder.innerHTML='';model=new QRCode(holder,{text:v,width:64,height:64,correctLevel:QRCode.CorrectLevel.H})._oQRCode}
  catch(e){model=null;$('msg').textContent='ข้อมูลยาวเกินไป ลองทำให้สั้นลง'}
  render();
}

/* ทุกอย่างคำนวณเป็น "หน่วยโมดูล" แล้วค่อยขยายเป็นพิกเซลจริง จึงคมทุกขนาด */
function geo(){
  const n=model.getModuleCount(),t=n+8,p=S.frame?2:0,b=S.frame?5:0;
  return{n,t,p,W:t+2*p,H:t+2*p+b};
}
const inFinder=(r,c,n)=>(r<7&&c<7)||(r<7&&c>=n-7)||(r>=n-7&&c<7);
function mods(g){
  const o=g.p+4,a=[];
  for(let r=0;r<g.n;r++)for(let c=0;c<g.n;c++)if(model.isDark(r,c))
    a.push({x:c+o,y:r+o,sq:S.style==='square'||inFinder(r,c,g.n)});
  return a;
}
function logoBox(g){
  if(!S.logo)return null;
  const ls=g.t*0.2,cx=g.W/2,cy=g.p+g.t/2,iw=S.logo.naturalWidth,ih=S.logo.naturalHeight;
  const w=iw>=ih?ls:ls*iw/ih,h=iw>=ih?ls*ih/iw:ls;
  return{cx,cy,ls,x:cx-w/2,y:cy-h/2,w,h};
}
function paint(cv,px){
  const g=geo(),s=px/g.W;cv.width=px;cv.height=Math.round(g.H*s);
  const ctx=cv.getContext('2d');ctx.save();ctx.scale(s,s);
  ctx.fillStyle='#fff';ctx.fillRect(0,0,g.W,g.H);
  if(S.frame){
    ctx.fillStyle=S.fg;ctx.beginPath();ctx.roundRect(0,0,g.W,g.H,3);ctx.fill();
    ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(g.p,g.p,g.t,g.t,1.5);ctx.fill();
    ctx.fillStyle='#fff';ctx.font='600 3.2px Prompt,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText($('ftext').value||'สแกนเลย',g.W/2,g.p+g.t+(g.H-g.p-g.t)/2);
  }
  ctx.fillStyle=S.fg;ctx.beginPath();
  mods(g).forEach(m=>{
    if(m.sq)ctx.rect(m.x,m.y,1,1);
    else if(S.style==='round'){ctx.roundRect(m.x,m.y,1,1,.35)}
    else{ctx.moveTo(m.x+.95,m.y+.5);ctx.arc(m.x+.5,m.y+.5,.45,0,7)}
  });
  ctx.fill();
  const L=logoBox(g);
  if(L){
    ctx.fillStyle='#fff';ctx.beginPath();ctx.roundRect(L.cx-L.ls/2-.6,L.cy-L.ls/2-.6,L.ls+1.2,L.ls+1.2,1);ctx.fill();
    ctx.drawImage(S.logo,L.x,L.y,L.w,L.h);
  }
  ctx.restore();
}
function toSVG(px){
  const g=geo(),h=Math.round(px*g.H/g.W);let d='';
  mods(g).forEach(m=>{
    if(m.sq)d+=`<rect x="${m.x}" y="${m.y}" width="1" height="1"/>`;
    else if(S.style==='round')d+=`<rect x="${m.x}" y="${m.y}" width="1" height="1" rx=".35"/>`;
    else d+=`<circle cx="${m.x+.5}" cy="${m.y+.5}" r=".45"/>`;
  });
  let o=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${g.W} ${g.H}" width="${px}" height="${h}"><rect width="${g.W}" height="${g.H}" fill="#fff"/>`;
  if(S.frame)o+=`<rect width="${g.W}" height="${g.H}" rx="3" fill="${S.fg}"/><rect x="${g.p}" y="${g.p}" width="${g.t}" height="${g.t}" rx="1.5" fill="#fff"/><text x="${g.W/2}" y="${g.p+g.t+(g.H-g.p-g.t)/2}" fill="#fff" font-family="Prompt,sans-serif" font-weight="600" font-size="3.2" text-anchor="middle" dominant-baseline="central">${($('ftext').value||'สแกนเลย').replace(/[<&]/g,'')}</text>`;
  o+=`<g fill="${S.fg}">${d}</g>`;
  const L=logoBox(g);
  if(L)o+=`<rect x="${L.cx-L.ls/2-.6}" y="${L.cy-L.ls/2-.6}" width="${L.ls+1.2}" height="${L.ls+1.2}" rx="1" fill="#fff"/><image href="${S.logoURL}" x="${L.x}" y="${L.y}" width="${L.w}" height="${L.h}"/>`;
  return o+'</svg>';
}

function render(){
  const ok=!!model;$('stage').classList.toggle('ready',ok);$('dl').disabled=!ok;
  if(ok)paint($('cv'),640);
}
$('logo').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  const r=new FileReader();
  r.onload=()=>{const i=new Image();i.onload=()=>{S.logo=i;S.logoURL=r.result;sync()};i.src=r.result};
  r.readAsDataURL(f);e.target.value='';
};
$('rmlogo').onclick=()=>{S.logo=S.logoURL=null;sync()};

function save(blob,name){
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);$('msg').textContent='ดาวน์โหลดแล้ว: '+name;
}
$('dl').onclick=()=>{
  if(!model)return;
  const name='QR_'+S.size+'.'+S.fmt;
  if(S.fmt==='svg')return save(new Blob([toSVG(S.size)],{type:'image/svg+xml'}),name);
  const c=document.createElement('canvas');paint(c,S.size);
  c.toBlob(b=>b?save(b,name):$('msg').textContent='สร้างไฟล์ไม่สำเร็จ ลองเลือกขนาดที่เล็กลง',
    S.fmt==='jpg'?'image/jpeg':'image/png',.95);
};
(document.fonts?document.fonts.ready:Promise.resolve()).then(render);
sync();
</script>
</body>
</html>
