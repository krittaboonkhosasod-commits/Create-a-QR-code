<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ปฏิทินการทำงาน</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prompt:wght@500;600;700&family=Sarabun:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f5f7;--surface:#fff;--ink:#111827;--muted:#6b7280;--line:#e3e6eb;--field:#f1f3f6;
  --accent:#4338ca;--accent-ink:#fff;
  --work:#16a34a;--leave:#dc2626;--late:#ea8a00;--site:#2563eb;--off:#7b8494;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1117;--surface:#171c26;--ink:#e8ebf2;--muted:#8f99ab;--line:#272e3c;--field:#202736;
  --accent:#8b8cf8;--accent-ink:#0e1117;
  --work:#3ddc84;--leave:#ff6b6b;--late:#ffb347;--site:#5aa9ff;--off:#9aa4b5}}
:root[data-theme="dark"]{
  --bg:#0e1117;--surface:#171c26;--ink:#e8ebf2;--muted:#8f99ab;--line:#272e3c;--field:#202736;
  --accent:#8b8cf8;--accent-ink:#0e1117;
  --work:#3ddc84;--leave:#ff6b6b;--late:#ffb347;--site:#5aa9ff;--off:#9aa4b5}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:16px/1.5 Sarabun,system-ui,sans-serif}
h1,h2,.num{font-family:Prompt,Sarabun,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}

:root{--hol:#0b8a4a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hol:#4ade80}}
:root[data-theme="dark"]{--hol:#4ade80}
.cell.hol{border-color:color-mix(in srgb,var(--hol) 55%,var(--line))}
.cell.hol:not([data-s]){background:color-mix(in srgb,var(--hol) 14%,var(--surface))}
.cell.hol .n{color:var(--hol)}
.cell.hol.today .n{color:var(--accent-ink)}
.cell .hn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;font-weight:600;line-height:1.25;color:var(--hol);margin-bottom:2px}
.cell.hol::before{content:"";position:absolute;top:8px;right:8px;width:8px;height:8px;border-radius:50%;background:var(--hol)}
.eh{margin:6px 0 0;padding:6px 10px;border-radius:10px;background:color-mix(in srgb,var(--hol) 14%,var(--surface));color:var(--hol);font-size:13px;font-weight:600}
@media (max-width:860px){.cell .hn{display:none}}

.xl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:-4px 0 16px;font-size:13px;color:var(--muted)}
.xl .btn{font-size:14px}
/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:20px}
.lcard{width:100%;max-width:340px}
.lcard h1{font-size:30px;margin:0 0 6px;line-height:1.2}
.lcard p{margin:0 0 22px;color:var(--muted)}
.lcard input{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
.lcard .btn{width:100%;margin-top:12px;padding:13px}

/* app */
.app{max-width:1200px;margin:0 auto;padding:18px 16px 40px}
.bar{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;margin-bottom:14px}
.bar h1{margin:0;font-size:28px;line-height:1.2}
.nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.nav{position:relative}
.pick{font-family:Prompt,sans-serif;font-weight:600;min-width:150px;text-align:center}
.pop{position:absolute;top:calc(100% + 8px);left:0;z-index:30;width:290px;max-width:calc(100vw - 32px);background:var(--surface);
  border:1px solid var(--line);border-radius:16px;padding:12px;box-shadow:0 14px 36px rgba(0,0,0,.2)}
.pyr{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;font-family:Prompt,sans-serif}
.pyr button{border:0;background:var(--field);width:36px;height:36px;border-radius:10px;cursor:pointer;font-size:18px}
.pm{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pm button{border:0;background:var(--field);border-radius:10px;padding:11px 0;cursor:pointer;font-size:14px}
.pm button.now{box-shadow:inset 0 0 0 1.5px var(--accent)}
.pm button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.user{color:var(--muted);display:flex;gap:8px;align-items:center;font-size:14px}

.punch{display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between;
  background:var(--ink);color:var(--bg);border-radius:16px;padding:14px 18px;margin-bottom:16px}
.punch .t{font-family:Prompt,sans-serif;font-weight:600;font-size:18px}
.punch .s{opacity:.75;font-size:14px}
.punch .acts{display:flex;gap:8px}
.punch button{border:0;border-radius:10px;padding:10px 16px;font-weight:600;cursor:pointer;background:var(--bg);color:var(--ink)}
.punch button.go{background:var(--work);color:#fff}

.layout{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:20px;align-items:start}
.stats{display:flex;flex-wrap:wrap;gap:6px 20px;margin-bottom:12px;font-size:14px;color:var(--muted)}
.stats b{color:var(--ink);font-family:Prompt,sans-serif;font-size:17px;margin-right:3px}
.stats i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}

.grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.dow{text-align:center;font-size:13px;color:var(--muted);padding:4px 0}
.dow:first-child,.dow:last-child{color:var(--leave)}
.cell{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;
  min-height:92px;padding:8px 9px;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.cell.we{background:var(--field)}
.cell[data-s]{background:color-mix(in srgb,var(--c) 13%,var(--surface));border-color:color-mix(in srgb,var(--c) 40%,var(--line))}
.cell[data-s]::after{content:"";position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--g,var(--c))}
.cell .n{font-family:Prompt,sans-serif;font-weight:600;font-size:17px}
.cell .l{font-size:12px;font-weight:600;color:var(--c)}
.cell .tm{font-size:11px;color:var(--muted)}
.cell .nt.st{font-weight:600;color:var(--site);-webkit-line-clamp:1}
.cell .nt{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:11px;line-height:1.3;color:var(--ink);margin-top:2px;word-break:break-word}
.cell.today .n{background:var(--accent);color:var(--accent-ink);border-radius:8px;padding:0 7px;align-self:flex-start}
.cell.sel{outline:2px solid var(--ink);outline-offset:1px}

/* editor */
.panel{position:sticky;top:14px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px}
.ph{display:flex;justify-content:space-between;gap:10px;margin-bottom:14px}
.ph h2{margin:0;font-size:20px;line-height:1.3}
.ph p{margin:2px 0 0;color:var(--muted);font-size:14px}
.x{display:none;border:0;background:var(--field);border-radius:10px;width:36px;height:36px;cursor:pointer}
.seg{display:grid;grid-template-columns:repeat(5,1fr);gap:5px;margin-bottom:14px}
.seg button{border:1px solid var(--line);background:var(--field);border-radius:10px;padding:8px 0;font-size:13px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff;font-weight:600}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.panel label{display:block;font-size:13px;color:var(--muted);margin-bottom:12px}
.panel input,.panel textarea{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--field);color:var(--ink)}
.panel textarea{resize:vertical;min-height:72px}
.link{border:0;background:none;color:var(--leave);cursor:pointer;padding:0;font-size:14px}
.hint{color:var(--muted);margin:0}
.scrim{display:none}

@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .cell{min-height:60px;padding:6px}
  .cell .l,.cell .tm,.cell .nt{display:none}
  .cell[data-s]::after{left:6px;right:6px;bottom:5px;border-radius:2px}
  .panel{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:20;border-radius:20px 20px 0 0;max-height:85vh;overflow:auto;
    padding-bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .2s}
  .panel.open{transform:none}
  .x{display:block}
  .scrim.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:15}
  .punch{position:sticky;top:0;z-index:5}
}
@media (prefers-reduced-motion:reduce){.panel{transition:none}}
</style>
</head>
<body>

<section class="login" id="login">
  <div class="lcard">
    <h1>ปฏิทินการทำงาน</h1>
    <p>ใส่ชื่อผู้ใช้เพื่อเริ่มบันทึกเวลาเข้า-ออกงาน</p>
    <input id="username" placeholder="ชื่อผู้ใช้งาน" autocomplete="username" aria-label="ชื่อผู้ใช้งาน">
    <button class="btn pri" id="loginBtn">เข้าใช้งาน</button>
  </div>
</section>

<main class="app" id="app" hidden>
  <header class="bar">
    <h1 id="title"></h1>
    <div class="nav">
      <button class="btn" id="prev" aria-label="เดือนก่อนหน้า">‹</button>
      <button class="btn pick" id="pick" aria-haspopup="dialog" aria-expanded="false"><span id="pickLbl"></span></button>
      <div class="pop" id="pop" role="dialog" aria-label="เลือกเดือนและปี" hidden>
        <div class="pyr"><button id="yPrev" aria-label="ปีก่อนหน้า">‹</button><b id="yLbl"></b><button id="yNext" aria-label="ปีถัดไป">›</button></div>
        <div class="pm" id="pm"></div>
      </div>
      <button class="btn" id="next" aria-label="เดือนถัดไป">›</button>
      <button class="btn" id="goToday">วันนี้</button>
    </div>
    <div class="user"><span id="who"></span><button class="btn" id="logoutBtn">ออกจากระบบ</button></div>
  </header>

  <section class="punch">
    <div><div class="t" id="pt"></div><div class="s" id="ps"></div></div>
    <div class="acts"><button class="go" id="pin">เข้างานตอนนี้</button><button id="pout">ออกงานตอนนี้</button></div>
  </section>

  <div class="xl">
    <button class="btn" id="xExp" type="button">⬇ ส่งออก Excel</button>
    <button class="btn" id="xImp" type="button">⬆ นำเข้า Excel</button>
    <input type="file" id="xFile" accept=".xlsx,.xls,.csv" hidden>
    <span>ข้อมูลทั้งหมดของผู้ใช้นี้ · นำเข้าไฟล์ที่ส่งออกจากที่นี่หรือแม่แบบ Calendar_Data.xlsx (อ่านแท็บวันหยุดบริษัทด้วย)</span>
  </div>
  <div class="layout">
    <div>
      <div class="stats" id="stats"></div>
      <div class="grid" id="grid"></div>
    </div>
    <aside class="panel" id="panel" aria-label="บันทึกรายวัน">
      <p class="hint" id="empty">เลือกวันในปฏิทินเพื่อบันทึก</p>
      <div id="edit" hidden>
        <div class="ph">
          <div><h2 id="eDate"></h2><p id="eHours"></p><p class="eh" id="eHol" hidden></p></div>
          <button class="x" id="eClose" aria-label="ปิด">✕</button>
        </div>
        <div class="seg" id="seg" role="group" aria-label="สถานะ (เลือกได้มากกว่า 1)"></div>
        <div class="row" id="times">
          <label>เวลาเข้า<input type="time" id="eIn"></label>
          <label>เวลาออก<input type="time" id="eOut"></label>
        </div>
        <label id="siteW">ไซต์งาน<input id="eSite" placeholder="ชื่อไซต์"></label>
        <label>หมายเหตุ<textarea id="eNote" placeholder="เพิ่มรายละเอียด"></textarea></label>
        <button class="link" id="eClear">ล้างข้อมูลวันนี้</button>
      </div>
    </aside>
  </div>
  <div class="scrim" id="scrim"></div>
</main>

<script>
const MONTHS=["มกราคม","กุมภาพันธ์","มีนาคม","เมษายน","พฤษภาคม","มิถุนายน","กรกฎาคม","สิงหาคม","กันยายน","ตุลาคม","พฤศจิกายน","ธันวาคม"];
const DOW=["อาทิตย์","จันทร์","อังคาร","พุธ","พฤหัสบดี","ศุกร์","เสาร์"];
const DS=["อา","จ","อ","พ","พฤ","ศ","ส"];
const ST={work:"ทำงาน",leave:"ลา",late:"มาสาย",site:"ออกไซต์",off:"หยุด"};
const TIMED=["work","late","site"];
const DEF_IN="08:00",DEF_OUT="17:30"; // เวลาเริ่มต้น แก้ไขได้ทุกวัน
const $=id=>document.getElementById(id);
const HOL={
"2027-0-1":["วันขึ้นปีใหม่","วันขึ้นปีใหม่ / New Year's Holiday"],
"2027-1-22":["วันมาฆบูชา (ชดเชย)","วันมาฆบูชา (ชดเชยวันอาทิตย์ที่ 21 กุมภาพันธ์)"],
"2027-3-6":["วันจักรี","วันจักรี / Chakri Day"],
"2027-3-13":["วันสงกรานต์","วันสงกรานต์ / Songkran Festival"],
"2027-3-14":["วันสงกรานต์","วันสงกรานต์ / Songkran Festival"],
"2027-3-15":["วันสงกรานต์","วันสงกรานต์ / Songkran Festival"],
"2027-4-1":["วันแรงงานแห่งชาติ","วันแรงงานแห่งชาติ / National Labour Day"],
"2027-4-20":["วันวิสาขบูชา","วันวิสาขบูชา / Wisakha Bucha Day"],
"2027-5-3":["วันเฉลิมพระชนมพรรษา พระราชินี","วันเฉลิมพระชนมพรรษาสมเด็จพระนางเจ้าสุทิดา พัชรสุธาพิมลลักษณ พระบรมราชินี"],
"2027-6-19":["วันอาสาฬหบูชา (ชดเชย)","วันอาสาฬหบูชา (ชดเชยวันอาทิตย์ที่ 18 กรกฎาคม)"],
"2027-6-28":["วันเฉลิมพระชนมพรรษา ร.10","วันเฉลิมพระชนมพรรษา พระบาทสมเด็จพระเจ้าอยู่หัว"],
"2027-7-12":["วันแม่แห่งชาติ","วันเฉลิมพระชนมพรรษา สมเด็จพระนางเจ้าสิริกิติ์ พระบรมราชินีนาถ พระบรมราชชนนีพันปีหลวง และวันแม่แห่งชาติ"],
"2027-9-13":["วันนวมินทรมหาราช","วันคล้ายวันสวรรคต พระบาทสมเด็จพระปรมินทรมหาภูมิพลอดุลยเดชมหาราช บรมนาถบพิตร"],
"2027-9-23":["วันปิยมหาราช","วันปิยมหาราช / Chulalongkorn Day"],
"2027-11-6":["วันพ่อแห่งชาติ (ชดเชย)","วันคล้ายวันพระบรมราชสมภพ พระบาทสมเด็จพระปรมินทรมหาภูมิพลอดุลยเดชมหาราช บรมนาถบพิตร / วันชาติ และวันพ่อแห่งชาติ (ชดเชยวันอาทิตย์ที่ 5 ธันวาคม)"],
"2027-11-31":["วันสิ้นปี","วันสิ้นปี / New Year's Eve"]
}; // วันหยุดประเพณี ปี 2027 (เดือนนับจาก 0 = มกราคม) ตามประกาศ HO-69/070
try{const c=JSON.parse(localStorage.getItem("wc-hol")||"null");
  if(c&&typeof c==="object"){Object.keys(HOL).forEach(k=>delete HOL[k]);Object.assign(HOL,c)}}catch(e){}
const holOf=(y,m,d)=>{const h=HOL[`${y}-${m}-${d}`];return h?{t:h[0],n:h[1]}:null};
const mq=matchMedia("(max-width:860px)");
let user=null,sel=null;

/* storage (key format unchanged, old data kept) */
const key=(y,m,d)=>`wc-${user}-${y}-${m}-${d}`;
function load(k){try{return JSON.parse(localStorage.getItem(k)||"{}")}catch(e){return {}}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
const ORDER=Object.keys(ST);
const rec=(y,m,d)=>{const r=load(key(y,m,d));
  let a=Array.isArray(r.statuses)?r.statuses:(r.status?[r.status]:[]);
  r.statuses=ORDER.filter(s=>a.includes(s));delete r.status;return r};
function patch(y,m,d,p){const v=Object.assign({statuses:[],in:"",out:"",site:"",note:""},rec(y,m,d),p);save(key(y,m,d),v);return v}
const hoursOf=r=>{
  if(!r.in||!r.out)return 0;
  const a=r.in.split(":"),b=r.out.split(":");
  const h=((+b[0]*60+ +b[1])-(+a[0]*60+ +a[1]))/60;return h>0?h:0};
const hhmm=()=>{const n=new Date();return String(n.getHours()).padStart(2,"0")+":"+String(n.getMinutes()).padStart(2,"0")};
const fmtDate=(y,m,d)=>`${DOW[new Date(y,m,d).getDay()]}ที่ ${d} ${MONTHS[m]} ${y+543}`;
let CM=0,CY=0;
const cur=()=>({m:CM,y:CY});

/* setup */
$("seg").innerHTML=Object.keys(ST).map(s=>`<button type="button" data-s="${s}" style="--c:var(--${s})" aria-pressed="false">${ST[s]}</button>`).join("");

function goTo(dt,pick){
  CM=dt.getMonth();CY=dt.getFullYear();
  const t=new Date();
  sel=pick||(dt.getMonth()===t.getMonth()&&dt.getFullYear()===t.getFullYear()?t.getDate():null);
  renderAll();
}
const shift=n=>{const c=cur();goTo(new Date(c.y,c.m+n,1))};

/* login */
function enter(u){
  user=u;try{localStorage.setItem("wc-user",u)}catch(e){}
  $("login").hidden=true;$("app").hidden=false;$("who").textContent=u;goTo(new Date());
}
$("loginBtn").onclick=()=>{
  const u=$("username").value.trim();
  if(!u){$("username").focus();$("username").placeholder="กรุณาใส่ชื่อผู้ใช้งาน";return}
  enter(u)};
$("username").onkeydown=e=>{if(e.key==="Enter")$("loginBtn").click()};
$("logoutBtn").onclick=()=>{try{localStorage.removeItem("wc-user")}catch(e){}location.reload()};
$("prev").onclick=()=>shift(-1);$("next").onclick=()=>shift(1);
$("goToday").onclick=()=>goTo(new Date());


/* quick punch */
function renderPunch(){
  const t=new Date(),r=rec(t.getFullYear(),t.getMonth(),t.getDate());
  $("pt").textContent=`วันนี้ ${DS[t.getDay()]}. ${t.getDate()} ${MONTHS[t.getMonth()]}`;
  const parts=[];
  if(r.statuses.length)parts.push(r.statuses.map(s=>ST[s]).join(" + "));
  if(r.in)parts.push("เข้า "+r.in);
  if(r.out)parts.push("ออก "+r.out);
  $("ps").textContent=parts.length?parts.join(" · "):"ยังไม่ได้บันทึก";
}
function punch(kind){
  const t=new Date(),y=t.getFullYear(),m=t.getMonth(),d=t.getDate(),r=rec(y,m,d);
  const p={};if(!r.statuses.some(s=>TIMED.includes(s)))p.statuses=ORDER.filter(s=>s==="work"||r.statuses.includes(s)&&s!=="off"&&s!=="leave");
  if(kind==="in")p.in=hhmm();else p.out=hhmm();
  patch(y,m,d,p);renderAll();
}
$("pin").onclick=()=>punch("in");$("pout").onclick=()=>punch("out");

/* grid + stats */
function renderStats(){
  const {y,m}=cur(),days=new Date(y,m+1,0).getDate(),n={work:0,leave:0,late:0,site:0,off:0};let h=0,hc=0;
  for(let d=1;d<=days;d++){const r=rec(y,m,d);r.statuses.forEach(s=>n[s]++);h+=hoursOf(r);if(holOf(y,m,d))hc++}
  $("stats").innerHTML=Object.keys(ST).map(s=>`<span><i style="--c:var(--${s})"></i><b>${n[s]}</b>${ST[s]}</span>`).join("")+
    `<span><i style="--c:var(--hol)"></i><b>${hc}</b>วันหยุดบริษัท</span><span><b>${h.toFixed(1)}</b>ชม. รวม</span>`;
}
function renderGrid(){
  const {y,m}=cur(),first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate(),t=new Date();
  let html=DS.map(n=>`<div class="dow">${n}</div>`).join("");
  for(let i=0;i<first;i++)html+=`<div></div>`;
  for(let d=1;d<=days;d++){
    const r=rec(y,m,d),wd=new Date(y,m,d).getDay();
    const isT=d===t.getDate()&&m===t.getMonth()&&y===t.getFullYear();
    const hd=holOf(y,m,d);
    const cls=["cell",wd===0||wd===6?"we":"",hd?"hol":"",isT?"today":"",sel===d?"sel":""].join(" ");
    const tm=r.in||r.out?`${r.in||"--:--"}–${r.out||"--:--"}`:"";
    const ss=r.statuses,k=ss.length;
    const g=k?`linear-gradient(90deg,${ss.map((s,i)=>`var(--${s}) ${i*100/k}% ${(i+1)*100/k}%`).join(",")})`:"";
    const esc=t=>t.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
    let nt="";
    if(ss.includes("site")&&r.site&&r.site.trim())nt+=`<span class="nt st" title="${esc(r.site)}">${esc(r.site.trim())}</span>`;
    if((ss.includes("site")||ss.includes("leave"))&&r.note&&r.note.trim())nt+=`<span class="nt" title="${esc(r.note)}">${esc(r.note.trim())}</span>`;
    const lbl=ss.map(s=>`<span style="color:var(--${s})">${ST[s]}</span>`).join(" ");
    html+=`<button class="${cls}" data-d="${d}" ${k?`data-s="${ss[0]}" style="--c:var(--${ss[0]});--g:${g}"`:""} aria-label="${fmtDate(y,m,d)}${hd?" วันหยุด "+hd.n:""}${k?" "+ss.map(s=>ST[s]).join(" "):""}">
      <span class="n">${d}</span><span>${hd?`<span class="hn" title="${hd.n}">${hd.t}</span>`:""}<span class="l">${lbl}</span><br><span class="tm">${tm}</span>${nt}</span></button>`;
  }
  $("grid").innerHTML=html;
}
$("grid").onclick=e=>{
  const b=e.target.closest(".cell");if(!b)return;
  sel=+b.dataset.d;renderGrid();renderEditor();
  if(mq.matches)openSheet(true);
};

/* editor */
function openSheet(on){$("panel").classList.toggle("open",on);$("scrim").classList.toggle("open",on)}
$("scrim").onclick=$("eClose").onclick=()=>openSheet(false);
function renderEditor(){
  const {y,m}=cur();
  $("empty").hidden=sel!==null;$("edit").hidden=sel===null;
  if(sel===null)return;
  const r=rec(y,m,sel);
  $("eDate").textContent=fmtDate(y,m,sel);
  const hd=holOf(y,m,sel);$("eHol").hidden=!hd;if(hd)$("eHol").textContent="วันหยุดบริษัท: "+hd.n;
  $("eIn").value=r.in||"";$("eOut").value=r.out||"";$("eSite").value=r.site||"";$("eNote").value=r.note||"";
  syncEditor();
}
function syncEditor(){
  const {y,m}=cur(),r=rec(y,m,sel);
  [...$("seg").children].forEach(b=>b.setAttribute("aria-pressed",r.statuses.includes(b.dataset.s)));
  $("times").hidden=!r.statuses.some(s=>TIMED.includes(s));
  $("siteW").hidden=!r.statuses.includes("site");
  const h=hoursOf(r);
  $("eHours").textContent=h?`ทำงาน ${h.toFixed(1)} ชั่วโมง`:(r.statuses.length?r.statuses.map(s=>ST[s]).join(" + "):"ยังไม่ได้เลือกสถานะ");
}
function changed(){renderGrid();renderStats();renderPunch();syncEditor()}
$("seg").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  const {y,m}=cur(),r=rec(y,m,sel),s=b.dataset.s,on=!r.statuses.includes(s);
  const next=ORDER.filter(x=>x===s?on:r.statuses.includes(x)),p={statuses:next};
  if(on&&TIMED.includes(s)&&!r.in&&!r.out){p.in=DEF_IN;p.out=DEF_OUT;$("eIn").value=DEF_IN;$("eOut").value=DEF_OUT}
  patch(y,m,sel,p);changed();
};
[["eIn","in"],["eOut","out"],["eSite","site"],["eNote","note"]].forEach(([id,f])=>{
  $(id).oninput=()=>{const {y,m}=cur();patch(y,m,sel,{[f]:$(id).value});changed()};
});
$("eClear").onclick=()=>{
  const {y,m}=cur();
  try{localStorage.removeItem(key(y,m,sel))}catch(e){}
  renderEditor();changed();
};

function renderAll(){
  const {y,m}=cur();
  $("title").textContent=`${MONTHS[m]} ${y+543}`;
  document.title=`ปฏิทินการทำงาน – ${MONTHS[m]} ${y+543}`;
  $("pickLbl").textContent=`${MONTHS[m]} ${y+543}`;
  renderGrid();renderStats();renderPunch();renderEditor();
}

/* month/year picker */
let PY=0;
function drawPop(){
  const t=new Date();
  $("yLbl").textContent=PY+543;
  $("pm").innerHTML=MONTHS.map((n,i)=>`<button data-m="${i}" aria-pressed="${i===CM&&PY===CY}" class="${i===t.getMonth()&&PY===t.getFullYear()?"now":""}">${n}</button>`).join("");
}
function togglePop(on){
  $("pop").hidden=!on;$("pick").setAttribute("aria-expanded",on);
  if(on){PY=CY;drawPop()}
}
$("pick").onclick=e=>{e.stopPropagation();togglePop($("pop").hidden)};
$("pop").onclick=e=>e.stopPropagation();
$("yPrev").onclick=()=>{PY--;drawPop()};
$("yNext").onclick=()=>{PY++;drawPop()};
$("pm").onclick=e=>{
  const b=e.target.closest("button");if(!b)return;
  togglePop(false);goTo(new Date(PY,+b.dataset.m,1));
};
document.addEventListener("click",()=>togglePop(false));
document.addEventListener("keydown",e=>{if(e.key==="Escape"){togglePop(false);openSheet(false)}});

/* Excel export / import — แท็บแรก: ผู้ใช้ | วันที่ | สถานะ | เวลาเข้า | เวลาออก | ชั่วโมง | ไซต์งาน | หมายเหตุ */
const XHEAD=["ผู้ใช้","วันที่ (ปี-เดือน-วัน)","สถานะ","เวลาเข้า","เวลาออก","ชั่วโมง","ไซต์งาน","หมายเหตุ"];
const pad=n=>String(n).padStart(2,"0");
function userRows(){
  const pre=`wc-${user}-`,rows=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);if(!k||!k.startsWith(pre))continue;
    const p=k.slice(pre.length).split("-");if(p.length!==3||p.some(x=>!/^\d+$/.test(x)))continue;
    const y=+p[0],m=+p[1],d=+p[2],r=rec(y,m,d);
    if(!r.statuses.length&&!r.in&&!r.out&&!r.site&&!r.note)continue;
    rows.push([user,`${y}-${pad(m+1)}-${pad(d)}`,r.statuses.map(s=>ST[s]).join(", "),r.in||"",r.out||"",+hoursOf(r).toFixed(2),r.site||"",r.note||""]);
  }
  return rows.sort((a,b)=>a[1]<b[1]?-1:a[1]>b[1]?1:0);
}
$("xExp").onclick=()=>{
  if(!window.XLSX){alert("โหลดตัวช่วย Excel ไม่ได้ กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วรีเฟรช");return}
  const rows=userRows();
  if(!rows.length){alert("ยังไม่มีข้อมูลให้ส่งออก");return}
  const ws=XLSX.utils.aoa_to_sheet([XHEAD,...rows]);
  ws["!cols"]=[16,20,22,11,11,10,22,36].map(w=>({wch:w}));
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,"บันทึกรายวัน");
  const hr=Object.keys(HOL).map(k=>{const [y,m,d]=k.split("-").map(Number);return [`${y}-${pad(m+1)}-${pad(d)}`,HOL[k][0],HOL[k][1]]}).sort((a,b)=>a[0]<b[0]?-1:1);
  const hs=XLSX.utils.aoa_to_sheet([["วันที่","ชื่อวันหยุด","รายละเอียด"],...hr]);
  hs["!cols"]=[14,34,70].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb,hs,"วันหยุดบริษัท");
  XLSX.writeFile(wb,`Calendar_${user}.xlsx`);
};
const num2ymd=n=>{const d=new Date(Math.round((n-25569)*864e5));return [d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()]};
const toHM=v=>{
  if(v===""||v==null)return "";
  if(typeof v==="number"){const t=Math.round((v%1)*1440);return pad(Math.floor(t/60)%24)+":"+pad(t%60)}
  const m=String(v).match(/(\d{1,2})[:.](\d{2})/);return m?pad(+m[1])+":"+m[2]:"";
};
const toSts=v=>{const t=String(v||"");return ORDER.filter(s=>t.includes(ST[s])||new RegExp("\\b"+s+"\\b","i").test(t))};
$("xImp").onclick=()=>{
  if(!window.XLSX){alert("โหลดตัวช่วย Excel ไม่ได้ กรุณาเชื่อมต่ออินเทอร์เน็ตแล้วรีเฟรช");return}
  $("xFile").click();
};
$("xFile").onchange=async e=>{
  const f=e.target.files[0];e.target.value="";if(!f)return;
  try{
    const wb=XLSX.read(await f.arrayBuffer(),{type:"array"});
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:true,defval:""}).slice(1);
    const hn=wb.SheetNames.find(n=>n.includes("วันหยุด"));
    const hrows=hn?XLSX.utils.sheet_to_json(wb.Sheets[hn],{header:1,raw:true,defval:""}).slice(1):[];
    const hol={};
    hrows.forEach(r=>{
      let y,m,d;
      if(typeof r[0]==="number")[y,m,d]=num2ymd(r[0]);
      else{const t=String(r[0]).trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(!t)return;y=+t[1];m=t[2]-1;d=+t[3]}
      if(y>2400)y-=543;
      const title=String(r[1]||"").trim();if(!title)return;
      hol[`${y}-${m}-${d}`]=[title,String(r[2]||"").trim()||title];
    });
    const hc=Object.keys(hol).length;
    const ok=[];let bad=0;
    rows.forEach(r=>{
      if(r.every(x=>x===""))return;
      let y,m,d;
      if(typeof r[1]==="number")[y,m,d]=num2ymd(r[1]);
      else{const t=String(r[1]).trim().match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(!t){bad++;return}y=+t[1];m=t[2]-1;d=+t[3]}
      if(y>2400)y-=543;
      if(m<0||m>11||d<1||d>31){bad++;return}
      ok.push([String(r[0]||"").trim()||user,y,m,d,{statuses:toSts(r[2]),in:toHM(r[3]),out:toHM(r[4]),site:String(r[6]||""),note:String(r[7]||"")}]);
    });
    if(!ok.length&&!hc){alert("ไม่พบแถวข้อมูลที่อ่านได้ (ตรวจว่าแท็บแรกเป็นแท็บบันทึกรายวัน)");return}
    if(!confirm(`พบบันทึกรายวัน ${ok.length} รายการ${bad?` (ข้าม ${bad} แถวที่วันที่ผิดรูปแบบ)`:""}${hc?`\nและวันหยุดบริษัท ${hc} วัน (จะใช้แทนรายการวันหยุดเดิมทั้งหมด)`:""}\nวันที่ซ้ำกับที่มีอยู่จะถูกเขียนทับ ต้องการนำเข้าหรือไม่?`))return;
    if(hc){Object.keys(HOL).forEach(k=>delete HOL[k]);Object.assign(HOL,hol);try{localStorage.setItem("wc-hol",JSON.stringify(hol))}catch(e){}}
    ok.forEach(([u,y,m,d,v])=>save(`wc-${u}-${y}-${m}-${d}`,v));
    renderAll();alert("นำเข้าเรียบร้อย: บันทึกรายวัน "+ok.length+" รายการ"+(hc?" · วันหยุดบริษัท "+hc+" วัน":""));
  }catch(err){alert("อ่านไฟล์ไม่สำเร็จ")}
};
let saved=null;try{saved=localStorage.getItem("wc-user")}catch(e){}
if(saved)enter(saved);
</script>
